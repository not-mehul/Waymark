# Weekly, grouped, so a dependency bump is one pull request to review rather
# than a dozen. The build workflow runs on each, which is the review that
# matters: if it is green, the bump compiles, passes, lints and still upgrades
# from the Kotlin app on the emulator.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Capacitor's packages move together; @capacitor/android's version is
      # also the Android project's Capacitor library.
      capacitor:
        patterns: ["@capacitor/*"]
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*", "prettier-plugin-svelte", "eslint-plugin-svelte"]
      tooling:
        patterns: ["vite", "vite-*", "vitest", "@vitest/*", "typescript", "typescript-eslint", "eslint", "@eslint/*", "prettier", "@playwright/*"]

  # The Android shell's own dependencies (android/variables.gradle and the
  # build files beside it).
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
