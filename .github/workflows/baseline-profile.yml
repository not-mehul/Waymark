name: Baseline profile

# Records the baseline profile on a Gradle-managed emulator and commits it to
# the branch, then measures cold start with and without it. Slow — it boots
# an emulator — so it runs on demand: by hand, or for a push whose commit
# message says [baseline profile].
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline profile]')
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator needs hardware acceleration, which the runner has but
      # does not hand to an ordinary user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate the profile
        run: >
          ./gradlew --no-daemon :app:generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Commit the profile
        run: |
          git add 'app/src/*/generated/baselineProfiles/*.txt'
          if git diff --cached --quiet; then
            echo "The profile has not changed."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Record the baseline profile"
            git push
          fi

      - name: Measure cold start
        continue-on-error: true
        run: >
          ./gradlew --no-daemon :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.waymark.baselineprofile.StartupBenchmark

      # The numbers, in the log, so they can be read without downloading the
      # artifact.
      - name: Print cold start
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json
          for path in glob.glob('baselineprofile/build/outputs/**/*benchmarkData.json', recursive=True):
              for bench in json.load(open(path))['benchmarks']:
                  for metric, m in bench['metrics'].items():
                      print(f"{bench['name']}: {metric} median {m['median']:.0f} ms"
                            f" (min {m['minimum']:.0f}, max {m['maximum']:.0f}, {len(m['runs'])} runs)")
          PY

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: |
            baselineprofile/build/outputs/
            app/src/*/generated/baselineProfiles/
          retention-days: 14
