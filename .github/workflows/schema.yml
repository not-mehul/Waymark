name: Record the database schema

# Room writes a JSON description of each database version, which the
# migration tests and the build's schema check rely on. After changing the
# database, push a commit whose message contains [record schema] (or run this
# by hand): it builds, and commits the schema Room wrote to the branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record schema]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the database
        run: ./gradlew --no-daemon :core:data:kspDebugKotlin

      - name: Commit the schema
        run: |
          git add core/data/schemas
          if git diff --cached --quiet; then
            echo "The schema is already committed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Record the Room schema"
          git push
