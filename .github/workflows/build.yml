name: Build

# The everyday checks. Every push runs the web app's checks (tokens and
# contrast, formatting, lint, types, the unit suite and a production build).
# Pull requests and main also build the Android shell and run its unit tests.
# The emulator upgrade test, Android lint and Kotlin style live in
# device-checks.yml and run by hand; the release APK is built by release.yml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    # A branch of this repository is already covered by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run sync
      - name: Unit tests and debug build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest assembleDebug
