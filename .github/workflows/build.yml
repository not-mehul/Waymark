name: Build

# Every push gets the checks the release gets: style, the unit suite, Android
# lint and a debug APK that actually assembles. A pull request from a branch
# of this repository is already covered by the push that updated it, so only
# a pull request from a fork runs here a second time. The release APK is built
# by release.yml, from a tag.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KTLINT_VERSION: "1.3.1"
  KTLINT_SHA256: ea7590217143ce897584f067826a2f75bd639f00547f7bd9d0eb8bf4498af061
  DETEKT_VERSION: "1.23.7"
  DETEKT_SHA256: 84beded283012cb2b38bcaef4996452fcd6069d2e9ca74b50eaa79e0ad21897e

jobs:
  style:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The command-line tools, pinned and checksummed, rather than Gradle
      # plugins: they need nothing from Google's Maven and run in seconds.
      - name: Fetch ktlint and detekt
        run: |
          base=https://repo1.maven.org/maven2
          curl -sSfL -o ktlint.jar "$base/com/pinterest/ktlint/ktlint-cli/$KTLINT_VERSION/ktlint-cli-$KTLINT_VERSION-all.jar"
          curl -sSfL -o detekt.jar "$base/io/gitlab/arturbosch/detekt/detekt-cli/$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
          echo "$KTLINT_SHA256  ktlint.jar" | sha256sum -c -
          echo "$DETEKT_SHA256  detekt.jar" | sha256sum -c -

      - name: ktlint
        run: java -jar ktlint.jar "app/src/**/*.kt" "*.kts" "app/*.kts" --relative

      - name: detekt
        run: >
          java -jar detekt.jar
          --input app/src/main/java,app/src/test/java
          --config config/detekt.yml
          --build-upon-default-config

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # Room writes the schema of the current database version on every
      # build. A schema the build changed, or one it wrote that is not
      # committed, is a database change nobody has reviewed — and the next
      # version's migration test will need it.
      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            echo "::error::The Room schema changed. Build locally and commit app/schemas."
            exit 1
          fi

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
