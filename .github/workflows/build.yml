name: Build

# Every push gets the checks the release gets: style, the unit suite, Android
# lint and a debug APK that actually assembles. A pull request from a branch
# of this repository is already covered by the push that updated it, so only
# a pull request from a fork runs here a second time. The release APK is built
# by release.yml, from a tag.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KTLINT_VERSION: "1.8.0"
  KTLINT_SHA256: 369ad2b789f95a011f807e1fcb690ccef80bd7cd014fd139e73ae82dcc0baeab
  DETEKT_VERSION: "1.23.8"
  DETEKT_SHA256: 3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245

jobs:
  style:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The command-line tools, pinned and checksummed, rather than Gradle
      # plugins: they need nothing from Google's Maven and run in seconds.
      - name: Fetch ktlint and detekt
        run: |
          base=https://repo1.maven.org/maven2
          curl -sSfL -o ktlint.jar "$base/com/pinterest/ktlint/ktlint-cli/$KTLINT_VERSION/ktlint-cli-$KTLINT_VERSION-all.jar"
          curl -sSfL -o detekt.jar "$base/io/gitlab/arturbosch/detekt/detekt-cli/$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION-all.jar"
          echo "$KTLINT_SHA256  ktlint.jar" | sha256sum -c -
          echo "$DETEKT_SHA256  detekt.jar" | sha256sum -c -

      - name: ktlint
        run: java -jar ktlint.jar "**/src/**/*.kt" "**/*.kts" "!**/build/**" --relative

      - name: detekt
        run: |
          sources=$(find . -path ./build-logic -prune -o -type d \( -path '*/src/main/java' -o -path '*/src/test/java' \) -print | paste -sd, -)
          java -jar detekt.jar --input "$sources" --config config/detekt.yml --build-upon-default-config

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      # The benchmark module only builds against a release-like app, which
      # nothing above compiles; this keeps it compiling between profile runs.
      - name: Build the benchmarks
        run: ./gradlew --no-daemon :baselineprofile:assembleBenchmarkRelease

      # Room writes the schema of the current database version on every
      # build. A schema the build changed, or one it wrote that is not
      # committed, is a database change nobody has reviewed — and the next
      # version's migration test will need it.
      - name: Room schema is committed
        run: |
          if [ -n "$(git status --porcelain core/data/schemas)" ]; then
            git status --porcelain core/data/schemas
            echo "::error::The Room schema changed. Build locally and commit core/data/schemas."
            exit 1
          fi

      # Every screenshot test is compared with the reference committed beside
      # it; screenshots.yml records new references after an intended change,
      # and this push is not the one to check them against.
      - name: Screenshots match
        if: ${{ !contains(github.event.head_commit.message, '[record screenshots]') }}
        run: ./gradlew --no-daemon verifyRoborazziDebug

      - name: Android lint
        run: ./gradlew --no-daemon lintDebug

      # Warnings do not fail the build, so they are printed where they will
      # be seen rather than left in a report nobody downloads.
      - name: Lint findings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "No lint report."

      - name: Gradle 10 deprecations (temporary)
        if: always()
        run: ./gradlew --no-daemon help --warning-mode all 2>&1 | grep -i -B2 -A6 "deprecat" | head -150 || true

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
            app/build/reports/lint-results-debug.html
          retention-days: 7
