name: Export the Room schema (one-off)

# Writes app/schemas for the current database version and commits it to the
# branch that asked. Removed again once the schema is in the repository; the
# build workflow checks it stays current from then on.
on:
  push:
    branches: ["ccr-3c225ce7-sltqxd"]
    paths: [".github/workflows/schema-export.yml"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:kspDebugKotlin
      - name: Commit the schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          git diff --cached --quiet && exit 0
          git commit -m "Commit the Room schema for database version 4"
          git push
