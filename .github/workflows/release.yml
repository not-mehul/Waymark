name: Release

# Publishing is a tag push:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# which runs the tests, builds the release APK, signs it if the repository has
# a keystore in its secrets, and attaches it to a GitHub release as a draft for
# you to write notes on and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # Written outside the workspace so a stray `git add -A` in a later step
      # can never stage it. Absent secrets leave the file unwritten, and the
      # build falls through to producing an unsigned APK.
      - name: Restore the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret — the APK will be unsigned and cannot be installed. See RELEASING.md."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waymark.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        env:
          WAYMARK_KEYSTORE: ${{ runner.temp }}/waymark.jks
          WAYMARK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WAYMARK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WAYMARK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK after the tag
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ -n "$version" ] || version="$GITHUB_SHA"
          suffix=""
          [ "${{ steps.keystore.outputs.signed }}" = "true" ] || suffix="-unsigned"
          source=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          [ -n "$source" ] || { echo "No APK was produced"; exit 1; }
          target="waymark-${version}${suffix}.apk"
          cp "$source" "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: waymark-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A draft, not a publish: the release notes are yours to write, and an
      # unsigned build should never go out without somebody noticing it.
      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Waymark ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Waymark ${{ github.ref_name }} — an offline-first travel companion for Android.

            **Install:** download the APK below and open it on the phone. Android
            will ask you to allow installing from this source the first time.

            Requires Android 8.0 (API 26) or later.
