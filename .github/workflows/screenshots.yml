name: Record screenshots

# Screenshot references are drawn on the same Linux runner that checks them,
# so a font or anti-aliasing difference between machines never reads as a
# change. After an intended visual change, push a commit whose message says
# [record screenshots] (or run this by hand): it records every screenshot
# test and commits the new references to the branch it ran on.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[record screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record
        run: ./gradlew --no-daemon recordRoborazziDebug

      - name: Commit the references
        run: |
          git add '**/src/test/screenshots/*.png'
          if git diff --cached --quiet; then
            echo "The references already match."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Record screenshot references"
          git push
