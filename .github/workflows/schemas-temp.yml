name: Export historic Room schemas (temporary)

on:
  push:
    branches: ["ccr-3c225ce7-sltqxd"]
    paths: [".github/workflows/schemas-temp.yml"]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        commit: [c39ea8d, eb49627, dd68ad3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate the schema at ${{ matrix.commit }}
        run: |
          git checkout -q ${{ matrix.commit }}
          ./gradlew --no-daemon -q :app:kspDebugKotlin
          for f in $(find app/schemas -name '*.json'); do
            echo "===== BEGIN $f"
            base64 -w0 "$f"
            echo
            echo "===== END $f"
          done
