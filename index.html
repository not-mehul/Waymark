<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110e" />
    <meta name="description" content="Offline-first trip planner." />
    <title>Waymark</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script>
      // Put the page on the saved side before the first paint (style.md §14).
      try {
        const saved = localStorage.getItem('waymark.theme');
        const dark =
          saved === 'DUSK' || (saved !== 'DAWN' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        // Storage blocked: main.ts applies the system side.
      }
    </script>
  </head>
  <body>
    <div class="glow-layer" aria-hidden="true">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

    <main id="app" class="app-shell"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
